<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <script>
      // Prevent accidental browser smart-zoom / pinch-zoom on rapid clicking or trackpad gestures
      window.addEventListener('wheel', function(e) {
        if (e.ctrlKey || e.metaKey) e.preventDefault();
      }, { passive: false });
      window.addEventListener('gesturestart', function(e) { e.preventDefault(); });
      window.addEventListener('gesturechange', function(e) { e.preventDefault(); });
      window.addEventListener('gestureend', function(e) { e.preventDefault(); });
      document.addEventListener('dblclick', function(e) { e.preventDefault(); }, { passive: false });
    </script>
    <title>Alanya Clicker | Mediterranean Summer Pool Vibes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@700;800&family=Fredoka:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Rubik+Bubbles&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0f172a] text-white antialiased overflow-hidden select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
